{% extends "base.html" %}
{% block title %}Notes — Dashcam Investigator{% endblock %}
{% block body %}
<section class="notes-panel">
    <header class="notes-header">
        <div>
            <h3 id="notes-title">No video selected</h3>
            <p class="muted" id="notes-subtitle">Select a video from the sidebar to add notes.</p>
        </div>
        <div class="notes-actions">
            <span id="notes-toast" class="toast" hidden></span>
            <button id="btn-flag" class="btn btn-secondary" type="button" disabled>
                {{ inline_svg('flag') }}
                <span id="btn-flag-label">Flag video</span>
            </button>
            <button id="btn-save" class="btn btn-primary" type="button" disabled>
                {{ inline_svg('check') }}
                <span>Save note</span>
            </button>
        </div>
    </header>
    <textarea id="notes-text" class="textarea" placeholder="Start typing here..." disabled></textarea>
</section>
<script src="{{ static('js/pages/notes.js') }}" defer></script>
{% endblock %}
