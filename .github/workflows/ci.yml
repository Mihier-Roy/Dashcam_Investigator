name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a release'
        required: true
        type: boolean
        default: false
      release_version:
        description: 'Release version (e.g., v1.0.0)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run ruff linter
        run: uv run ruff check .

      - name: Check formatting with black
        run: uv run black --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run tests with pytest
        run: uv run pytest -v

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run bandit security linter
        run: uv run bandit -r dashcam_investigator -ll

      - name: Audit dependencies for known vulnerabilities
        run: uv run pip-audit

  package:
    name: Package (${{ matrix.os }})
    needs: [lint-and-format, test]
    if: github.event_name == 'workflow_dispatch' && inputs.create_release == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: DashcamInvestigator-windows-x86_64
            artifact_path: dist/DashcamInvestigator-windows-x86_64.zip
          - os: ubuntu-latest
            artifact_name: DashcamInvestigator-linux-x86_64
            artifact_path: |
              dist/DashcamInvestigator-linux-x86_64.tar.gz
              dist/DashcamInvestigator-x86_64.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Cache appimagetool
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v4
        with:
          path: /tmp/appimagetool
          key: appimagetool-x86_64-continuous

      - name: Build with PyInstaller
        run: uv run pyinstaller --noconfirm --clean DashcamInvestigator.spec

      - name: Package Windows zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/DashcamInvestigator/* -DestinationPath dist/DashcamInvestigator-windows-x86_64.zip

      - name: Package Linux tar.gz
        if: matrix.os == 'ubuntu-latest'
        run: |
          tar -czf dist/DashcamInvestigator-linux-x86_64.tar.gz -C dist DashcamInvestigator

      - name: Build Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          if [ ! -x /tmp/appimagetool ]; then
            curl -L -o /tmp/appimagetool \
              https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
            chmod +x /tmp/appimagetool
          fi
          sudo install /tmp/appimagetool /usr/local/bin/appimagetool
          ./packaging/linux/build_appimage.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [package]
    if: github.event_name == 'workflow_dispatch' && inputs.create_release == true
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine release version
        id: version
        run: |
          if [ -n "${{ inputs.release_version }}" ]; then
            echo "version=${{ inputs.release_version }}" >> $GITHUB_OUTPUT
          else
            echo "version=v$(date -u +'%Y.%m.%d-%H%M%S')" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            artifacts/DashcamInvestigator-windows-x86_64/DashcamInvestigator-windows-x86_64.zip
            artifacts/DashcamInvestigator-linux-x86_64/DashcamInvestigator-linux-x86_64.tar.gz
            artifacts/DashcamInvestigator-linux-x86_64/DashcamInvestigator-x86_64.AppImage
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
